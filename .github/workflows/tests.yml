name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Run tests
        run: python -m pytest -q

  rename:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docker/rename
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: docker/rename/go.mod
      - name: Test maelstrom-rename
        run: go vet ./... && go test ./...

  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Build the sandbox image
        run: distsys-eval build-image --tag distsys-agent-eval/sandbox:ci
      - name: Run the Docker tests against it
        env:
          SANDBOX_TEST_IMAGE: distsys-agent-eval/sandbox:ci
        run: python -m pytest -q -m docker
