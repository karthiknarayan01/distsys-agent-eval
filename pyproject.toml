[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "distsys-agent-eval"
version = "0.1.0"
description = "A benchmark of how well coding agents write fault-tolerant distributed systems code, graded by Maelstrom"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Shellmate, the built-in agent, pinned so an attempt always runs a known agent loop
    "agent-runtime @ git+https://github.com/karthiknarayan01/Shellmate@5236a606658d3c8ce4ad41692826b12a03a8f2ff",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
distsys-eval = "distsys_eval.cli:main"

[tool.setuptools.packages.find]
include = ["distsys_eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["docker: needs a running Docker daemon (skipped without one)"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
